version: 2

models:
  - name: int_trading_signals
    description: "クロスオーバーシグナルとトレンド方向"
    columns:
      - name: date
        tests:
          - unique
          - not_null
      - name: signal
        description: "BUY / SELL / NULL のいずれか"
        tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
              config:
                where: "signal IS NOT NULL"
      - name: trend
        description: "BULLISH / BEARISH のいずれか"
        tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'BEARISH']